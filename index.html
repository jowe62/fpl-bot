<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const FPL_PROXY = "/api/fpl";
const TEAM_ID = 1036486;
// ── Designtokens ────────────────────────────────────────────────────────────
// Skandinavisk minimalism: varmt neutral botten, en enda textfärg som accent,
// och signalfärger som bara används när något faktiskt kräver uppmärksamhet.
// GafferOS designsystem v1.4. Nära svart canvas med lagrade ytor. Lime är
// ENDA varumärkesaccenten och reserveras för primär åtgärd, aktivt läge och
// användarens eget lag. Grönt och rött används bara för verklig numerisk
// riktning — aldrig som dekoration.
const T = {
  // Canvas & ytor — elevation genom yta, inte skugga
  bg:"#07090C", surface:"#0E1116", card:"#161A21", raised:"#161A21", overlay:"#1E242D",
  line:"#1E242D", lineStrong:"#2A313C",
  // Text
  ink:"#F2F5F8", mut:"#A7B0BD", dim:"#6C7684", disabled:"#4E5765",
  // Varumärke — lime = åtgärd, eget lag, primär serie.
  // De tre tonerna är interaktionslägen, inte fria nyanser: hover är LJUSARE
  // (300) och press MÖRKARE (700) än vilotillståndet (500).
  brand:"#C8FF2E", brandHover:"#DBFF6B", brandPress:"#A8DC10",
  // Semantik — riktning, aldrig dekoration
  good:"#24D07A", bad:"#FF4D5E", warn:"#FFAE33", info:"#2ED8FF", neutral:"#6C7684",
  alt:"#FF2E7E",
  warnBg:"rgba(255,174,51,.12)",
};

// Fixtursvårighet 1–5. Trean stannar neutralt grå så en rad medelmatcher
// läser som visuell tystnad — GafferOS §01.
const FDR_RAMP = {
  1:{bg:"rgba(36,208,122,.18)", fg:"#24D07A"},
  2:{bg:"rgba(36,208,122,.10)", fg:"#5FD99B"},
  3:{bg:"rgba(108,118,132,.14)", fg:"#A7B0BD"},
  4:{bg:"rgba(255,174,51,.14)",  fg:"#FFAE33"},
  5:{bg:"rgba(255,77,94,.16)",   fg:"#FF4D5E"},
};

// 4px-grid. Innanför datatäta ytor 8–16, mellan ytor 20–32, mellan
// sidsektioner 64. Radius hålls stram: 4 kontroller, 8 kort, 12 modal.
const SP = {1:4,2:8,3:12,4:16,5:24,6:32,8:48,10:64};
const R = {ctrl:4, card:8, modal:12, pill:999};
// Positionsmärken: dova toner ur samma varma familj, inte färgklickar.
const POS_TINT = {
  1:{background:"rgba(167,176,189,.12)",color:"#A7B0BD"},
  2:{background:"rgba(46,216,255,.12)", color:"#2ED8FF"},
  3:{background:"rgba(200,255,46,.12)", color:"#C8FF2E"},
  4:{background:"rgba(255,46,126,.12)", color:"#FF2E7E"},
};
const POS = {1:"MÅL",2:"FÖR",3:"MIT",4:"ANF"};

// Lagfärger. FPL exponerar inga — bootstrap.teams har varken colour, kit
// eller badge — så de ligger här. Nycklas på short_name, som är stabilt.
// Uppdatera vid upp- och nedflyttning; ett okänt lag får en neutral list.
const TEAM_COLOR = {
  ARS:"#EF0107", AVL:"#670E36", BOU:"#DA291C", BRE:"#E30613", BHA:"#0057B8",
  CHE:"#034694", COV:"#6CB4E4", CRY:"#1B458F", EVE:"#003399", FUL:"#B4B4B4",
  HUL:"#F5A12D", IPS:"#3A64A3", LEE:"#1D428A", LIV:"#C8102E", MCI:"#6CABDD",
  MUN:"#DA291C", NEW:"#41535F", NFO:"#DD0000", TOT:"#132257", SUN:"#EB172B",
};
const teamColor = sn => TEAM_COLOR[sn] || "#6C7684";
const POS_SV = {1:"Målvakt",2:"Försvarare",3:"Mittfältare",4:"Anfallare"};

const fplFetch = path =>
  fetch(FPL_PROXY + "?path=" + encodeURIComponent(path))
    .then(r => { if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); });

// ═══════════════════════════════════════════════════════════════════════════
// ODDS PLUGIN — hämtar riktiga odds via din Vercel-proxy (/api/odds).
// Proxyn hämtar anytime-goalscorer + clean sheet från Odds-API.io, matchar
// mot FPL:s id:n och cachar. Nyckeln ligger bara på servern, aldrig här.
// Modellen använder odds NÄR de finns, annars FPL:s underliggande xG-data.
// Ingen tyst fallback: oddsStatus visas i UI så du alltid vet vilken källa
// som gäller. Misslyckas proxyn kastar fetchOdds och UI visar det ärligt.
//
// ODDS_PROXY pekar på din route. Ligger boten på samma domän som proxyn
// (wennerqvist.design) räcker den relativa "/api/odds". Ligger den på annan
// domän, sätt full URL, t.ex. "https://<ditt-projekt>.vercel.app/api/odds".
// ═══════════════════════════════════════════════════════════════════════════
const ODDS_PROXY = "/api/odds";
const ODDS = {
  enabled: true,
  byTeam: {},
  byPlayer: {},
  coverage: null,
  async fetchOdds() {
    const r = await fetch(ODDS_PROXY);
    if (!r.ok) throw new Error("Odds-proxy HTTP " + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    // Nycklar kommer som strängar från JSON — normalisera till heltal så de
    // matchar FPL:s numeriska team/player-id i modellen.
    this.byTeam = {};
    for (const k of Object.keys(d.byTeam || {})) this.byTeam[+k] = d.byTeam[k];
    this.byPlayer = {};
    for (const k of Object.keys(d.byPlayer || {})) this.byPlayer[+k] = d.byPlayer[k];
    this.coverage = d.coverage || null;
    // Tomt svar = ingen matchtäckning just nu; behandla som "ej tillgängligt"
    // istället för att låtsas att odds-modellen är aktiv utan data.
    if (Object.keys(this.byPlayer).length === 0 && Object.keys(this.byTeam).length === 0) {
      throw new Error("Odds-proxy gav tomt svar");
    }
  }
};

// ── Fixture-helpers ────────────────────────────────────────────────────────
function avgFdr(tid,fm,n=5){const fx=(fm[tid]||[]).slice(0,n);return fx.length?fx.reduce((s,f)=>s+f.diff,0)/fx.length:3;}
function nextFdr(tid,fm){return(fm[tid]||[])[0]?.diff||3;}
function nextOpp(tid,fm,tb){const f=(fm[tid]||[])[0];return f?`${tb[f.oppId]?.short_name||"?"}(${f.home?"H":"B"})`:"-";}
function fxStr(tid,fm,tb,n=5){return(fm[tid]||[]).slice(0,n).map(f=>`GW${f.gw} ${tb[f.oppId]?.short_name}(${f.home?"H":"B"},${f.diff})`).join(" · ");}

// ── Status-helpers ──────────────────────────────────────────────────────────
function isInjured(p){return p.status==="u"||p.status==="s"||p.status==="i"||p.chance_of_playing_next_round===0;}
function isDoubtful(p){return p.chance_of_playing_next_round!==null&&p.chance_of_playing_next_round<75&&p.chance_of_playing_next_round>0;}

// ── Formaterings-helpers ────────────────────────────────────────────────────
function rewardLbl(xp){return xp>=6?"Hög":xp>=4?"Medel":"Låg";}
function riskFromFdr(d){return d<=2?"Låg":d<=3?"Medel":"Hög";}
function pdiffStr(a,b){const d=((a-b)/10).toFixed(1);return d>0?`+£${d}m`:d<0?`-£${Math.abs(d)}m`:"Samma pris";}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}

// ═══════════════════════════════════════════════════════════════════════════
// MODELLENS KÄRNA
//
// Teori bakom omskrivningen (belagd mot premium-tjänster):
//  1. xMins (speltidsandel) är den enskilt viktigaste faktorn. En spelare
//     som inte spelar ger 0 poäng oavsett hur bra han är. Vi skattar den som
//     andel spelade minuter, krympt mot 0.5 efter hur många omgångar som
//     hunnit spelas, plus skadestatus.
//  2. Underliggande data (xG/xA per 90) förutspår bättre än `form`, som är
//     brus på kort sikt (FPL Review: senaste 450 min mål ≈ värdelöst).
//  3. Clean sheet-potential för DEF/MV skattas från lagets expected_goals_
//     conceded_per_90 + hemmaplan, inte bara FDR-heltalet.
//  4. Odds används om ODDS.enabled — annars xG-proxyn. Aldrig tyst blandning.
// ═══════════════════════════════════════════════════════════════════════════

// Antal spelade omgångar. Sätts när bootstrap laddats. xMins behöver veta hur
// många chanser en spelare HAFT att spela, annars går andelen inte att räkna.
const SEASON = { gamesPlayed: 0, nextGw: 0, xgc: null, xgcLeague: 1.4, xgiPrior: null, attackScale: 1 };

// Lagets insläppta xG per 90, krympt mot ligasnittet efter hur många omgångar
// som hunnit spelas — samma disciplin som xMins.
//
// Varför: mätt mot bookmakerns (de-viggade) clean sheet-odds för GW2 gav den
// OKRYMPTA modellen RMSE 0.18, medan att bara gissa ligasnittet för alla lag
// gav 0.093. Lagets egen siffra efter en match var alltså SÄMRE än ingen
// information alls — Arsenal låg på 85% nolla i modellen mot oddsens 42%.
// Med krympning k=2 föll felet till 0.089. Krympningen släpper taget av sig
// själv när underlaget växer.
const XGC_PSEUDO_GAMES = 2;
function buildTeamXgc(bs){
  const acc={};
  for(const p of bs.elements){
    if(num(p.minutes)<45) continue;
    (acc[p.team] ??= []).push(num(p.expected_goals_conceded_per_90));
  }
  const raw={};
  for(const [t,v] of Object.entries(acc)) raw[t]=v.reduce((a,b)=>a+b,0)/v.length;
  const vals=Object.values(raw);
  const league=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:1.4;
  const g=SEASON.gamesPlayed;
  const out={};
  for(const t of bs.teams){
    const r = raw[t.id] ?? league;
    out[t.id] = (r*g + league*XGC_PSEUDO_GAMES)/(g+XGC_PSEUDO_GAMES);
  }
  SEASON.xgcLeague=league;
  return out;
}

// xMins: 0..1 förväntad andel av matchens minuter nästa GW.
//
// Andelen spelade minuter, krympt mot 0.5 med två pseudo-matcher. Krympningen
// hanterar tunt underlag utan att platta ut skillnader: efter en omgång får en
// spelare med hela matchen 0.67, en oanvänd 0.33 och en inbytt halvlek 0.50,
// och spridningen växer i takt med att underlaget gör det.
//
// Den gamla varianten byggde på starts_per_90 och dämpade dessutom allt under
// 270 minuter med en fast faktor. Det gav EXAKT 0.60 åt varenda startspelare de
// tre första omgångarna — modellens viktigaste faktor kunde inte skilja Haaland
// från en rotationsrisk. En glidande krympning har ingen sådan tröskel.
const XMINS_PRIOR = 0.5, XMINS_PSEUDO_GAMES = 2;
function xMins(p){
  if(isInjured(p)) return 0;
  const games = SEASON.gamesPlayed;
  if(!games) return XMINS_PRIOR;   // före säsongsstart finns inget att gå på
  const pseudo = XMINS_PSEUDO_GAMES * 90;
  let base = (num(p.minutes) + pseudo*XMINS_PRIOR) / (games*90 + pseudo);
  if(p.chance_of_playing_next_round!==null && p.chance_of_playing_next_round<100){
    base *= (p.chance_of_playing_next_round/100);
  }
  return Math.max(0,Math.min(base,1));
}

// Anfallshot per 90, krympt mot positionens baslinje efter spelade minuter.
//
// Rå xGI per 90 är brus efter få omgångar: Guéhi, en FÖRSVARARE, låg på 1.21
// efter att ha gjort mål på 0.89 xG i sin enda match — modellen projicerade
// det som en takt för resten av säsongen. Mätt mot GW2:s odds halverade
// krympningen felet (RMSE 0.83 → 0.39). Den släpper taget när underlaget växer.
const XGI_PSEUDO_MINUTES = 270;
function attackPer90(p){
  const base = SEASON.xgiPrior?.[p.element_type] ?? 0.2;
  const mins = num(p.minutes);
  const tot = num(p.expected_goal_involvements);
  return (tot + base*XGI_PSEUDO_MINUTES/90) / ((mins + XGI_PSEUDO_MINUTES)/90);
}

// Positionens minutviktade xGI per 90. Baslinjen krympningen drar mot.
function buildXgiPrior(bs){
  const out={};
  for(const t of [1,2,3,4]){
    let x=0,m=0;
    for(const p of bs.elements){
      if(p.element_type!==t || num(p.minutes)<=0) continue;
      x+=num(p.expected_goal_involvements); m+=num(p.minutes);
    }
    out[t] = m>0 ? x/m*90 : 0.2;
  }
  return out;
}

// Hemmafördel och fixtursvårighet i clean sheet-modellen. Anpassade mot
// bookmakerns odds för GW2 (20 lag). Den gamla koden hade 0.88/1.12, alltså
// ett hemmaövertag på 27% — anpassningen säger 10%. Bör räknas om när fler
// omgångar spelats; underlaget är tunt.
const CS_HOME_FACTOR = 1.10, CS_FDR_TILT = 0.26;

// Clean sheet-sannolikhet för spelarens lag i en given omgång (0..1).
// Odds används bara för NÄSTA omgång — det är den enda de gäller.
function cleanSheetProbAt(p,fm,gw,isNextGw){
  if(isNextGw && ODDS.enabled && ODDS.byTeam[p.team]?.csProb!=null){
    return ODDS.byTeam[p.team].csProb;
  }
  const f=(fm[p.team]||[]).find(x=>x.gw===gw);
  if(!f) return 0;                      // blank omgång: ingen match, ingen nolla
  const base = SEASON.xgc?.[p.team] ?? SEASON.xgcLeague;
  const lambda = base
    * (f.home ? 1/CS_HOME_FACTOR : CS_HOME_FACTOR)
    * Math.exp(CS_FDR_TILT*(f.diff-3));
  return Math.exp(-lambda);
}

// Förväntad målpoäng-komponent från odds om tillgängligt.
function oddsAttackXp(p,mult){
  if(!ODDS.enabled) return null;
  const o = ODDS.byPlayer[p.id];
  if(!o) return null;
  const goalPts = {1:6,2:6,3:5,4:4}[p.element_type]||4;
  return num(o.anytimeProb)*goalPts + num(o.assistProb)*3*mult;
}

// Fixtursvårighetens effekt på anfallsavkastning. Anpassad mot GW2:s
// (marginalkalibrerade) odds för 128 spelare med meningsfull xGI: medianen av
// odds/xGI-proxy föll monotont 0.48 → 0.32 → 0.26 över FDR 2, 3 och 4.
//
// VARNING: R² för den här tilten är 0.031. Riktningen är verklig men
// motståndet förklarar bara tre procent av variationen mellan spelare — det
// mesta är brus i xGI efter få omgångar. Använd den som en svag lutning, inte
// som en prognos.
const ATK_FDR_TILT = -0.23;

// De två vägarna till anfallspoäng — bookmakerodds och xGI-proxyn — låg på
// OLIKA skalor: summerat över spelarna med båda gav proxyn 137.7 poäng mot
// oddsens 83.1, alltså 1.64 gånger för mycket. Modellen summerade dem ändå i
// samma xP beroende på vad som råkade finnas, så en spelare med odds och en
// utan jämfördes med olika måttstock. Samma fel som vig-inkonsekvensen.
//
// Oddsen är marknadspriser och vinner. Skalan mäts om vid varje laddning mot
// de spelare som har båda, i stället för att spikas som en konstant — då
// följer den med när underlaget växer.
function calibrateAttackScale(elements,fm){
  let sumOdds=0, sumProxy=0;
  for(const p of elements){
    const o = oddsAttackXp(p,1);
    if(o==null || o<=0) continue;
    const f=(fm[p.team]||[]).find(x=>x.gw===SEASON.nextGw);
    if(!f) continue;
    const goalW={1:6,2:6,3:5,4:4}[p.element_type]||4;
    sumOdds += o;
    sumProxy += attackPer90(p)*(0.6*goalW+0.4*3)*Math.exp(ATK_FDR_TILT*(f.diff-3));
  }
  return sumProxy>0 ? sumOdds/sumProxy : 1;
}

// ── xP-skattning för EN omgång ──────────────────────────────────────────────
// Hanterar blank (ingen match → 0 poäng) och dubbel (två matcher → summan).
// Odds gäller bara nästa omgång; längre fram används xG/xGC-modellen.
function estimateXpAt(p,fm,gw,isNextGw){
  const mins = xMins(p);
  const type = p.element_type;
  const fixtures = (fm[p.team]||[]).filter(f=>f.gw===gw);
  const empty = {mins,apptPts:0,attack:0,csPts:0,bonus:0,matches:0};
  if(!fixtures.length) return {xp:0,parts:empty};

  const apptPer = mins>=0.6 ? 2 : (mins>0 ? 1 : 0);
  const bonusPer = num(p.ict_index)/38*0.15;
  const goalW = {1:6,2:6,3:5,4:4}[type]||4;

  let attack=0, csPts=0;
  for(const f of fixtures){
    const oddsAtt = isNextGw ? oddsAttackXp(p,1) : null;
    attack += oddsAtt!=null
      ? oddsAtt
      : attackPer90(p)*(0.6*goalW+0.4*3)*Math.exp(ATK_FDR_TILT*(f.diff-3))*SEASON.attackScale;
    const cs = cleanSheetProbAt(p,fm,gw,isNextGw);
    if(type===1||type===2) csPts += cs*4;
    else if(type===3)      csPts += cs*1;
  }
  const apptPts = apptPer*fixtures.length;
  const bonus = bonusPer*fixtures.length;
  return {
    xp:(apptPts+attack+csPts+bonus)*mins,
    parts:{mins,apptPts,attack,csPts,bonus,matches:fixtures.length}
  };
}

// Nästa omgång — den vanliga ingången. NEXT_GW sätts när bootstrap laddats.
function estimateXp(p,fm){ return estimateXpAt(p,fm,SEASON.nextGw,true); }

// ── Långsiktig xP: summan över kommande omgångar, per omgång ────────────────
// Den gamla varianten tog nästa omgångs xP och multiplicerade med en påhittad
// faktor ur FDR-snittet. Nu räknas varje omgång för sig med sin egen match,
// vilket också gör blank- och dubbelomgångar rätt i stället för utsmetade.
const LONG_HORIZON = 5;
function estimateXpOver(p,fm,fromGw,n=LONG_HORIZON){
  let sum=0;
  for(let g=fromGw; g<fromGw+n; g++) sum += estimateXpAt(p,fm,g,g===SEASON.nextGw).xp;
  return sum;
}
// Snitt per omgång, så talet är jämförbart med estimateXp.
function estimateXpLong(p,fm){ return estimateXpOver(p,fm,SEASON.nextGw)/LONG_HORIZON; }


// Ingen separat kaptenscoring. Den gamla la på +0.4 för hemmamatch ovanpå xP,
// vilket dels räknade hemmaplan två gånger — odds-baserad csProb och
// anytime-odds prissätter redan hemmafördelen, och xGC-fallbacken justerar
// för den explicit — dels rankade listan på ett tal den inte visade, så
// Haaland med 2.4 hamnade under Cunha med 2.1. Kapten rankas på xP, punkt.
// (Kommentaren påstod dessutom att den straffade lågt xMins hårdare. Det
// gjorde den aldrig.)

// ── Differentiell: xP men premiera lågt ägande ──────────────────────────────
function scoreDiff(p,fm){
  const own = num(p.selected_by_percent);
  if(own>15) return -999;
  return estimateXp(p,fm).xp + (15-own)*0.15;
}

function fdrBg(d){return (FDR_RAMP[d]||FDR_RAMP[3]).bg;}
function fdrTx(d){return (FDR_RAMP[d]||FDR_RAMP[3]).fg;}
function xpColor(xp){return xp>=6?T.good:xp>=4?T.brand:xp>=2?T.mut:T.dim;}

// ── Diagram ─────────────────────────────────────────────────────────────────
// GafferOS §11: en accent per serie, gridlines på 6% vitt aldrig ovanpå datan,
// märk ytterlägena i stället för varje tick.

// Staplad stapel som visar VAR en spelares xP kommer ifrån. Datan har alltid
// funnits i estimateXp().parts men kastades bort — det här är svaret på
// "varför är den här siffran 2.5".
function XpBreakdown({p,fm}){
  const e=estimateXp(p,fm);
  const segs=[
    {k:"Närvaro", v:e.parts.apptPts*e.parts.mins, col:T.mut},
    {k:"Anfall",  v:e.parts.attack*e.parts.mins,  col:T.brand},
    {k:"Clean sheet", v:e.parts.csPts*e.parts.mins, col:T.info},
    {k:"Bonus",   v:e.parts.bonus*e.parts.mins,   col:T.alt},
  ].filter(x=>x.v>0.005);
  const tot=segs.reduce((s,x)=>s+x.v,0);
  if(!tot) return null;
  return(
    <div style={{marginBottom:`${SP[4]}px`}}>
      <div style={c.chartRow}>
        <span style={c.chartName}>{p.web_name}</span>
        <span className="num" style={c.chartVal(T.ink)}>{e.xp.toFixed(1)}</span>
      </div>
      <div style={c.stackTrack}>
        {segs.map(x=>(
          <div key={x.k} title={`${x.k} ${x.v.toFixed(2)}`}
               style={{width:`${(x.v/tot)*100}%`,background:x.col,height:"100%"}}/>
        ))}
      </div>
    </div>
  );
}

// Ytgraf över kommande omgångar. Blank ger noll och syns som ett hål —
// hela poängen med att räkna per omgång i stället för att smeta ut ett snitt.
function XpSparkline({p,fm,n=5}){
  const gws=Array.from({length:n},(_,i)=>SEASON.nextGw+i);
  const vals=gws.map(g=>estimateXpAt(p,fm,g,g===SEASON.nextGw).xp);
  const max=Math.max(...vals,0.001);
  const W=180,H=40;
  const pts=vals.map((v,i)=>[i*(W/(n-1)), H-(v/max)*H]);
  const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  return(
    <div style={{marginBottom:`${SP[4]}px`}}>
      <div style={c.chartRow}>
        <span style={c.chartName}>{p.web_name}</span>
        <span className="num" style={c.chartVal(T.mut)}>{vals.reduce((a,b)=>a+b,0).toFixed(1)} xP / {n} omg</span>
      </div>
      <svg width={W} height={H+14} style={{display:"block",overflow:"visible"}}>
        <line x1="0" y1={H} x2={W} y2={H} stroke="rgba(255,255,255,.06)" strokeWidth="1"/>
        <path d={`${d} L ${W} ${H} L 0 ${H} Z`} fill="rgba(200,255,46,.10)"/>
        <path d={d} fill="none" stroke={T.brand} strokeWidth="1.5"/>
        {vals.map((v,i)=> v===0
          ? <circle key={i} cx={pts[i][0]} cy={H} r="2.5" fill={T.bad}/>
          : null)}
        <text x="0" y={H+12} fill={T.dim} fontSize="9" fontFamily="IBM Plex Mono">GW{gws[0]}</text>
        <text x={W} y={H+12} fill={T.dim} fontSize="9" fontFamily="IBM Plex Mono" textAnchor="end">GW{gws[n-1]}</text>
      </svg>
    </div>
  );
}

// Poäng per omgång mot ligasnittet. Guidens exempel jämför mot top 10k — den
// datan finns inte i FPL:s API, men events[].average_entry_score gör det.
// Diagrammet heter därför det det är.
function PointsPerGw({history,bs}){
  const rows=(history.current||[]).map(e=>({
    gw:e.event, you:e.points,
    avg:(bs.events.find(x=>x.id===e.event)||{}).average_entry_score ?? null,
  })).filter(r=>r.avg!=null);
  if(!rows.length) return null;
  const max=Math.max(...rows.flatMap(r=>[r.you,r.avg]),1);
  return(
    <div>
      <div style={c.chartLegend}>
        <span style={c.legendTxt}><i style={c.legendDot(T.brand)}/>Du</span>
        <span style={c.legendTxt}><i style={c.legendDot(T.dim)}/>Snittet</span>
      </div>
      <div style={c.barsWrap}>
        {rows.map(r=>{
          const diff=r.you-r.avg;
          const col=diff>2?T.good:diff<-2?T.bad:T.mut;
          return(
            <div key={r.gw} style={c.barCol}>
              <span className="num" style={{...c.barVal,color:col}}>{r.you}</span>
              <div style={c.barPair}>
                <div style={{width:"10px",height:`${(r.you/max)*90}px`,background:T.brand,borderRadius:"2px 2px 0 0"}}/>
                <div style={{width:"10px",height:`${(r.avg/max)*90}px`,background:T.dim,borderRadius:"2px 2px 0 0"}}/>
              </div>
              <span style={c.barLbl}>GW{r.gw}</span>
            </div>
          );

  );
}

// Hotanalys. Guidens exempel visar "shots in box" och "big chances" — de
// finns inte i FPL:s API. Det som finns är xG, xA, threat och creativity,
// och det är vad diagrammet visar. En accent per serie enligt §11.
function ThreatBreakdown({p,squad}){
  const metrics=[

// ── Optimal startelva ───────────────────────────────────────────────────────
// Maximerar summan av xP under FPL:s formationsregler. Reglerna läses ur
// bootstrap (element_types.squad_min_play / squad_max_play) i stället för att
// hårdkodas, så de följer med om FPL ändrar dem.
//
// Uttömmande över alla lagliga formationer, och inom varje position räcker det
// att ta de N högsta — så svaret är bevisat optimalt, inte en heuristik.
function bestXI(squad, fm, elementTypes){
  const byPos={1:[],2:[],3:[],4:[]};
  for(const p of squad) if(byPos[p.element_type]) byPos[p.element_type].push(p);
  const xpOf=new Map(squad.map(p=>[p.id,estimateXp(p,fm).xp]));
  for(const k of Object.keys(byPos)) byPos[k].sort((a,b)=>xpOf.get(b.id)-xpOf.get(a.id));
  const lim=Object.fromEntries(elementTypes.map(t=>[t.id,{min:t.squad_min_play,max:t.squad_max_play}]));
  if(!lim[1]||!byPos[1].length) return null;
  let best=null;
  for(let d=lim[2].min; d<=lim[2].max; d++)
    for(let m=lim[3].min; m<=lim[3].max; m++)
      for(let f=lim[4].min; f<=lim[4].max; f++){
        if(1+d+m+f!==11) continue;
        if(byPos[2].length<d||byPos[3].length<m||byPos[4].length<f) continue;
        const xi=[...byPos[1].slice(0,1),...byPos[2].slice(0,d),...byPos[3].slice(0,m),...byPos[4].slice(0,f)];
        const total=xi.reduce((s,p)=>s+xpOf.get(p.id),0);
        if(!best||total>best.total) best={total,xi,formation:`${d}-${m}-${f}`};
      }
  if(!best) return null;
  const inXI=new Set(best.xi.map(p=>p.id));
  // Bänkordning styr auto-bytena: högst xP först bland utespelarna.
  // Reservmålvakten har egen plats och konkurrerar inte om den ordningen.
  const rest=squad.filter(p=>!inXI.has(p.id));
  best.benchGk=rest.filter(p=>p.element_type===1);
  best.bench=rest.filter(p=>p.element_type!==1).sort((a,b)=>xpOf.get(b.id)-xpOf.get(a.id));
  best.xpOf=xpOf;
  return best;
}

// Varför en spelare byts in eller ut. Grundas i det som faktiskt skiljer dem
// åt — skada väger tyngst, annars matchen och xP-skillnaden.
function lineupReason(inn, out, fm, tb, xpOf){
  if(isInjured(out)) return `${out.web_name} spelar inte.`;
  if(isDoubtful(out)) return `${out.web_name} är osäker — ${(xMins(out)*100).toFixed(0)}% speltid.`;
  const f=(fm[inn.team]||[]).find(x=>x.gw===SEASON.nextGw);
  const diff=(xpOf.get(inn.id)-xpOf.get(out.id)).toFixed(1);
  return f
    ? `${inn.web_name} möter ${tb[f.oppId]?.short_name} ${f.home?"hemma":"borta"} och ligger ${diff} xP över.`
    : `${inn.web_name} ligger ${diff} xP över.`;
}

// ── Template-XI ───────────────────────────────────────────────────────────────
// Den elva som flest managers faktiskt har. Ager du samma spelare som alla
// andra rör du dig med fältet: du rasar inte när de blankar, men du klättrar
// inte heller när de levererar. För någon som är ny är det den enskilt
// nyttigaste orienteringen — den säger om laget är byggt för att följa eller
// för att sticka ut.
//
// Äkta effective ownership kräver kaptensandelar, och FPL exponerar inga.
// Vi påstår därför inte att detta är EO. Det är ägarandel, inget annat.
const FORMATION_MIN = {1:1,2:3,3:3,4:1}, FORMATION_MAX = {1:1,2:5,3:5,4:3};
function templateXI(elements){
  const byPos = {1:[],2:[],3:[],4:[]};
  for(const p of elements) byPos[p.element_type]?.push(p);
  for(const k of Object.keys(byPos)) byPos[k].sort((a,b)=>num(b.selected_by_percent)-num(a.selected_by_percent));
  const xi = [];
  const taken = {1:0,2:0,3:0,4:0};
  for(const t of [1,2,3,4]){
    for(let i=0;i<FORMATION_MIN[t];i++){ const p=byPos[t][i]; if(p){xi.push(p);taken[t]++;} }
  }
  // Fyll resterande platser med de mest ägda som ryms inom formationstaken.
  const rest = [2,3,4].flatMap(t=>byPos[t].slice(FORMATION_MIN[t]).map(p=>p))
    .sort((a,b)=>num(b.selected_by_percent)-num(a.selected_by_percent));
  for(const p of rest){
    if(xi.length>=11) break;
    if(taken[p.element_type] < FORMATION_MAX[p.element_type]){ xi.push(p); taken[p.element_type]++; }
  }
  return xi;
}

// ── Chip-status ───────────────────────────────────────────────────────────────
// Vilka chips du faktiskt HAR kvar. bootstrap.chips ger fönstren — varje chip
// finns en gång per säsongshalva — och /entry/{id}/history/ ger vilka du använt
// och när. Utan detta kunde boten råda dig att spela ett wildcard du redan
// bränt, vilket den gjorde fram tills nu.
const CHIP_API_NAME = { wc:"wildcard", bb:"bboost", tc:"3xc", fh:"freehit" };
function chipAvailability(bs, history, gw){
  const used = history.chips || [];
  const out = {};
  for(const [id,apiName] of Object.entries(CHIP_API_NAME)){
    // Fönstret som omfattar den omgång vi planerar för.
    const win = (bs.chips||[]).find(c=>c.name===apiName && gw>=c.start_event && gw<=c.stop_event);
    if(!win){ out[id]={available:false,reason:"utanför chipfönstret",usedAt:null}; continue; }
    const spent = used.find(u=>u.name===apiName && u.event>=win.start_event && u.event<=win.stop_event);
    out[id] = spent
      ? {available:false,reason:`använt i GW${spent.event}`,usedAt:spent.event,window:win}
      : {available:true,reason:`tillgängligt GW${win.start_event}–${win.stop_event}`,usedAt:null,window:win};
  }
  return out;
}

// ── Live-trupp från bokmärkesknappen ────────────────────────────────────────
// FPL publicerar en omgångs trupp först efter dess deadline, och /my-team/
// kräver inloggning bakom ett botskydd som en serverfunktion inte tar sig
// förbi. Lösningen: en bokmärkesknapp som John klickar när han redan är
// inloggad på fantasy.premierleague.com. Den läser /api/my-team/ med hans
// egen session, i hans egen webbläsare, och skickar hit resultatet.
//
// Inget lösenord delas och inget botskydd kringgås — det är hans data,
// hämtad av honom själv.
const LIVE_KEY = "gafferos:myteam";

// Kastar hellre än att tyst använda data vi inte förstår. En trupp som ser
// fel ut är farligare än ingen trupp alls.
function validateLiveSquad(d){
  if(!d || typeof d!=="object") throw new Error("tom nyttolast");
  if(!Array.isArray(d.picks) || d.picks.length!==15)
    throw new Error(`förväntade 15 spelare, fick ${d.picks?.length}`);
  for(const p of d.picks)
    if(typeof p.element!=="number" || typeof p.position!=="number")
      throw new Error("picks saknar element eller position");
  if(typeof d.gw!=="number") throw new Error("saknar omgång");
  return d;
}

function readLiveSquad(gw){
  let raw;
  try{ raw = localStorage.getItem(LIVE_KEY); }catch{ return null; }
  if(!raw) return null;
  let d;
  try{ d = validateLiveSquad(JSON.parse(raw)); }
  catch(e){ console.warn("[GafferOS] sparad trupp förkastad:", e.message); return null; }
  // En trupp hämtad för en tidigare omgång är inte längre sann.
  if(d.gw !== gw) return null;
  return d;
}

// Bokmärkesknappen öppnar boten med nyttolasten i URL-fragmentet. Fragmentet
// skickas aldrig till servern, så truppen lämnar aldrig webbläsaren.
function captureLiveSquadFromHash(){
  const m = /[#&]team=([^&]+)/.exec(location.hash||"");
  if(!m) return null;
  try{
    const d = validateLiveSquad(JSON.parse(decodeURIComponent(escape(atob(m[1])))));
    d.savedAt = Date.now();
    try{ localStorage.setItem(LIVE_KEY, JSON.stringify(d)); }catch{}
    history.replaceState(null,"",location.pathname+location.search);
    return d;
  }catch(e){
    console.error("[GafferOS] kunde inte läsa truppen från bokmärkesknappen:", e.message);
    return {error:e.message};
  }
}

// ── Fria transfers ────────────────────────────────────────────────────────────
// FPL exponerar dem inte som fält, så de härleds ur /entry/{id}/history/.
// Regler (premierleague.com/en/news/2174907): din första omgång har obegränsade
// transfers; därefter får du EN per omgång. Oanvända rullar, taket är fem, och
// wildcard/free hit förbrukar inte bankade transfers. Varje transfer utöver de
// fria kostar 4 poäng.
const MAX_FREE_TRANSFERS = 5, HIT_COST = 4;
function freeTransfersFor(history, gw){
  const played = (history.current||[]).filter(e=>e.event<gw).sort((a,b)=>a.event-b.event);
  if(!played.length) return 1;
  const chipAt = Object.fromEntries((history.chips||[]).map(c=>[c.event,c.name]));
  const firstGw = played[0].event;   // den omgången hade obegränsade transfers
  let ft = 1;
  for(const e of played){
    if(e.event===firstGw) continue;
    const chip = chipAt[e.event];
    if(chip!=="wildcard" && chip!=="freehit") ft = Math.max(0, ft - e.event_transfers);
    ft = Math.min(MAX_FREE_TRANSFERS, ft + 1);
  }
  return ft;
}

// ── Transfer recs ─────────────────────────────────────────────────────────────
function buildRecs(starters,bench,bs,fm,tb,bank,gw,freeTransfers){
  const squadAll=[...starters,...bench];
  const myIds=new Set(squadAll.map(p=>p.id));
  const pool=bs.elements.filter(p=>xMins(p)>=0.5&&!myIds.has(p.id));

  // Max tre spelare per klubb. Regeln las ur bootstrap i stället för att
  // hårdkodas. Utan den föreslog boten spelare som inte gick att ta in —
  // Maguire med tre Man Utd-spelare redan i truppen.
  const TEAM_LIMIT = bs.game_settings?.squad_team_limit ?? 3;
  const perTeam={};
  for(const p of squadAll) perTeam[p.team]=(perTeam[p.team]||0)+1;

  const used=new Set();
  const trySwap=(scoreFn,extraFilter)=>{
    let best=null,bestG=-999;
    for(const out of starters){
      const budget=(out.now_cost/10)+bank;
      // Spelaren som går ut frigör sin klubbplats.
      const roomFor=t=>(perTeam[t]||0)-(out.team===t?1:0) < TEAM_LIMIT;
      const opts=pool.filter(p=>p.element_type===out.element_type&&p.now_cost/10<=budget&&!used.has(p.id)&&roomFor(p.team)&&(!extraFilter||extraFilter(p)));
      for(const inn of opts){const g=scoreFn(inn,fm)-scoreFn(out,fm);if(g>bestG){bestG=g;best={out,inn};}}
    }
    if(best)used.add(best.inn.id);
    return best;
  };
  const recs=[];
  const scoreShort=(p)=>estimateXp(p,fm).xp;
  const scoreLong=(p)=>estimateXpLong(p,fm);
  // Varje kort är ETT alternativ, alltså din första transfer den här omgången.
  // Har du minst en fri är den gratis, annars kostar den fyra poäng.
  const cost = freeTransfers>=1 ? 0 : HIT_COST;
  // Vinsten är skillnaden mot spelaren som går ut, inte den nyes xP. Ett kort
  // som visar "2.7 xP" utan att säga vad du hade förut säger ingenting.
  const verdict = net => net<=0 ? "nej" : net<0.5 ? "knappt" : "ja";

  const q=trySwap(scoreShort);
  if(q){const{out,inn}=q;const fdr=nextFdr(inn.team,fm);const ix=estimateXp(inn,fm);const ox=estimateXp(out,fm);
    recs.push({type:"quick",label:"Snabb fix",title:`${inn.web_name} in direkt`,out:out.web_name,inn:inn.web_name,
      priceDiff:pdiffStr(inn.now_cost,out.now_cost),
      reason:`${inn.web_name} (${tb[inn.team]?.short_name}) skattas till ${ix.xp.toFixed(1)} xP nästa omgång mot ${nextOpp(inn.team,fm,tb)} — speltid ${(ix.parts.mins*100).toFixed(0)}%. Ersätter ${out.web_name} (${ox.xp.toFixed(1)} xP, speltid ${(ox.parts.mins*100).toFixed(0)}%).`,
      fixtures:fxStr(inn.team,fm,tb,3),risk:riskFromFdr(fdr),reward:rewardLbl(ix.xp),gwImpact:`GW${gw}`,own:inn.selected_by_percent,news:inn.news||"",xp:ix.xp,
      gain:ix.xp-ox.xp, cost, net:(ix.xp-ox.xp)-cost, horizon:"denna omgång", verdict:verdict((ix.xp-ox.xp)-cost)});}

  const l=trySwap(scoreLong);
  if(l){const{out,inn}=l;const fdr5=avgFdr(inn.team,fm,5).toFixed(1);const ix=estimateXpLong(inn,fm);const ox5=estimateXpLong(out,fm);const gain5=(ix-ox5)*5;
    recs.push({type:"long",label:"Långsiktig",title:`${inn.web_name} för kommande omgångar`,out:out.web_name,inn:inn.web_name,
      priceDiff:pdiffStr(inn.now_cost,out.now_cost),
      reason:`${inn.web_name} har snitt-FDR ${fdr5} kommande 5 omgångar och skattas till ${ix.toFixed(1)} xP/GW över perioden. ${out.web_name} har sämre utsikter (FDR-snitt ${avgFdr(out.team,fm,5).toFixed(1)}).`,
      fixtures:fxStr(inn.team,fm,tb,5),risk:riskFromFdr(avgFdr(inn.team,fm,3)),reward:rewardLbl(ix),gwImpact:`GW${gw}–${gw+4}`,own:inn.selected_by_percent,news:inn.news||"",xp:ix,
      gain:gain5, cost, net:gain5-cost, horizon:"fem omgångar", verdict:verdict(gain5-cost)});}

  const d=trySwap(scoreDiff,p=>num(p.selected_by_percent)<=15);
  if(d){const{out,inn}=d;const own=num(inn.selected_by_percent).toFixed(1);const fdr=nextFdr(inn.team,fm);const ix=estimateXp(inn,fm);const ox2=estimateXp(out,fm);
    recs.push({type:"diff",label:"Differentiell",title:`${inn.web_name} — bara ${own}% äger`,out:out.web_name,inn:inn.web_name,
      priceDiff:pdiffStr(inn.now_cost,out.now_cost),
      reason:`${inn.web_name} ägs av bara ${own}% men skattas till ${ix.xp.toFixed(1)} xP nästa GW mot ${nextOpp(inn.team,fm,tb)} (FDR ${fdr}). Rankningshöjande om det träffar. Ersätter ${out.web_name}.`,
      fixtures:fxStr(inn.team,fm,tb,3),risk:"Hög",reward:rewardLbl(ix.xp),gwImpact:`GW${gw}`,own:inn.selected_by_percent,news:inn.news||"",xp:ix.xp,
      gain:ix.xp-ox2.xp, cost, net:(ix.xp-ox2.xp)-cost, horizon:"denna omgång", verdict:verdict((ix.xp-ox2.xp)-cost)});}
  return recs;
}

function PlayerCard({p,fm,tb,bench}){
  const e=estimateXp(p,fm);
  const f=(fm[p.team]||[])[0];
  const sn=tb[p.team]?.short_name;
  return(
    <div style={c.pCard(bench)}>
      <div style={c.pBar(teamColor(sn))}/>
      <div style={c.pBody}>
        <div style={c.pTop}>
          <span style={c.pos(p.element_type)}>{POS[p.element_type]}</span>
          {p.isCaptain&&<span style={c.pArm(T.brand)}>C</span>}
          {p.isVice&&<span style={c.pArm(T.mut)}>V</span>}
          {isInjured(p)&&<span style={c.pArm(T.bad)}>✕</span>}
          {!isInjured(p)&&isDoubtful(p)&&<span style={c.pArm(T.warn)}>!</span>}
        </div>
        <div style={c.pName}>{p.web_name}</div>
        <div style={c.pMeta}>
          {sn} · {f? <>{f.home?"":"@"}{tb[f.oppId]?.short_name}</> : "ingen match"}

        <div style={c.pStats}>

          <span className="num" style={c.pXp(e.xp)}>{e.xp.toFixed(1)}</span>
        </div>
      </div>
    </div>
  );
}

// Planvy. Raderna följer FPL:s uppställning så formationen går att läsa av.
// Bänken har ingen formation och ligger därför på en enda rad, som hos FPL.
function Pitch({players,fm,tb,bench,singleRow}){
  const rows = singleRow
    ? [players]
    : [1,2,3,4].map(t=>players.filter(p=>p.element_type===t)).filter(r=>r.length);
  return(
    <div style={c.pitch}>
      {rows.map((row,i)=>(
        <div key={i} style={c.pitchRow}>
          {row.map(p=><PlayerCard key={p.id} p={p} fm={fm} tb={tb} bench={bench}/>)}
        </div>
      ))}
    </div>
  );
}

        return(
          <div key={chip.id} style={{background:T.card,borderRadius:"14px",overflow:"hidden",marginBottom:"10px",border:`.5px solid ${open?T.ink:T.line}`}}>

                      <div style={{fontSize:"11px",color:T.mut}}>{estimateXp(chip.player,fm).xp.toFixed(1)} xP · {nextOpp(chip.player.team,fm,tb)}</div>
                    </div>
                    <div style={{background:fdrBg(nextFdr(chip.player.team,fm)),color:fdrTx(nextFdr(chip.player.team,fm)),borderRadius:"6px",padding:"3px 8px",fontSize:"11px",fontWeight:"500"}}>FDR {nextFdr(chip.player.team,fm)}</div>
                  </div>

                  <div style={{marginTop:"14px"}}>
                    <div style={{fontSize:"11px",color:T.good,fontWeight:"500",textTransform:"uppercase",letterSpacing:".05em",marginBottom:"8px"}}>✓ Argument för att köra nu</div>
                    {chip.pros.map((pro,i)=>(<div key={i} style={{display:"flex",gap:"8px",padding:"7px 10px",background:T.good,borderRadius:"8px",marginBottom:"4px",fontSize:"13px",color:T.ink,lineHeight:"1.5"}}><span style={{color:T.good,flexShrink:0}}>+</span>{pro}</div>))}
                  </div>
                )}
                {chip.cons.length>0&&(
                  <div style={{marginTop:"10px"}}>
                    <div style={{fontSize:"11px",color:T.bad,fontWeight:"500",textTransform:"uppercase",letterSpacing:".05em",marginBottom:"8px"}}>✗ Argument för att avvakta</div>
                    {chip.cons.map((con,i)=>(<div key={i} style={{display:"flex",gap:"8px",padding:"7px 10px",background:"#2E211E",borderRadius:"8px",marginBottom:"4px",fontSize:"13px",color:T.ink,lineHeight:"1.5"}}><span style={{color:T.bad,flexShrink:0}}>–</span>{con}</div>))}

// ── Veckan: ett svar pa "vad gor jag den har omgangen?" ────────────────────
// Allt annat i boten ar fordjupning. Den har vyn ska ga att lasa pa tio
// sekunder och sluta med ett beslut, inte med atta flikar att sortera sjalv.
function WeekTab({starters,bench,bs,fm,tb,bank,gw,freeTransfers,chipAvail,setTab}){
  const cap = useMemo(()=>[...starters].filter(p=>p.element_type!==1)
    .sort((a,b)=>estimateXp(b,fm).xp-estimateXp(a,fm).xp)[0],[starters,fm]);
  const recs = useMemo(()=>buildRecs(starters,bench,bs,fm,tb,bank,gw,freeTransfers),
    [starters,bench,bs,fm,tb,bank,gw,freeTransfers]);

  const best = recs.length ? recs.reduce((a,b)=>b.net>a.net?b:a) : null;
  const worthIt = best && best.verdict!=="nej";

  const hurt = starters.filter(p=>isInjured(p));
  const doubt = starters.filter(p=>!isInjured(p)&&isDoubtful(p));
  const benchOk = bench.filter(p=>!isInjured(p)&&xMins(p)>=0.5).length;
  const benchDead = bench.filter(p=>isInjured(p)).length;

  const chipsLeft = Object.entries(chipAvail).filter(([,a])=>a.available).length;
  const squad = useMemo(()=>[...starters,...bench],[starters,bench]);
  const xi = useMemo(()=>bestXI(squad,fm,bs.element_types),[squad,fm,bs]);
  // Vad som skiljer den optimala elvan från den du har uppställd nu.
  const nowIds = new Set(starters.map(p=>p.id));
  const bringIn = xi ? xi.xi.filter(p=>!nowIds.has(p.id)) : [];
  const dropOut = xi ? starters.filter(p=>!xi.xi.some(x=>x.id===p.id)) : [];
  const tmpl = useMemo(()=>templateXI(bs.elements),[bs]);
  const tmplIds = new Set(tmpl.map(p=>p.id));
  const overlap = starters.filter(p=>tmplIds.has(p.id)).length;
  const capFx = (fm[cap?.team]||[])[0];
  const capXp = cap?estimateXp(cap,fm).xp:0;

  return(
    <div>
      <div style={c.weekBlock}>
        <div style={c.weekKicker}>Kaptensbandet</div>
        {cap ? <>
          <div style={c.weekLead}>Sätt bandet på {cap.web_name}</div>
          <div style={c.weekSub}>
            {capXp.toFixed(1)} xP — högst i din startelva.
            {capFx && <> {capFx.home?"Hemma mot":"Borta mot"} {tb[capFx.oppId]?.name}.</>}
            {" "}Kaptenen räknas dubbelt, så det är veckans enskilt största beslut.
          </div>
        </> : <div style={c.weekLead}>Ingen kaptenskandidat hittad.</div>}
        <div style={{marginTop:"10px"}}>
          <button style={c.weekLink} onClick={()=>setTab("captain")}>Se hela rankningen</button>
        </div>
      </div>

      <hr style={c.weekRule}/>

      <div style={c.weekBlock}>
        <div style={c.weekKicker}>Laguppställning</div>
        {!xi ? <div style={c.weekLead}>Kunde inte räkna fram en laglig elva.</div> : <>
          <div style={c.weekLead}>
            {bringIn.length===0
              ? <>Din elva är redan den bästa</>
              : <>Byt in {bringIn.map(p=>p.web_name).join(" och ")}</>}
          </div>
          <div style={c.weekSub}>
            Formation {xi.formation} · {xi.total.toFixed(1)} xP totalt.
            {bringIn.length===0
              ? <> Ingen annan laglig uppställning av din trupp ger mer.</>
              : <> Bänka {dropOut.map(p=>p.web_name).join(" och ")}.</>}
          </div>
          {bringIn.map((p,i)=>(
            <div key={p.id} style={{...c.weekFlag(),marginTop:i===0?`${SP[4]}px`:0}}>
              <span style={c.weekDot(T.brand)}/>
              <span>{lineupReason(p,dropOut[i]||dropOut[0],fm,tb,xi.xpOf)}</span>
            </div>
          ))}
          <div style={c.lineupGrid}>
            {xi.xi.map(p=>(
              <div key={p.id} style={c.lineupCard(true)}>
                <span style={c.pos(p.element_type)}>{POS[p.element_type]}</span>
                <span style={c.lineupName}>{p.web_name}</span>
                <span className="num" style={c.lineupXp(xi.xpOf.get(p.id))}>{xi.xpOf.get(p.id).toFixed(1)}</span>
              </div>
            ))}
          </div>
          <div style={{...c.sLbl,marginTop:`${SP[5]}px`}}>Bänk · i ordning för auto-byten</div>
          <div style={c.lineupGrid}>
            {[...xi.benchGk,...xi.bench].map((p,i)=>(
              <div key={p.id} style={c.lineupCard(false)}>
                <span style={c.benchNo}>{p.element_type===1?"MV":i}</span>
                <span style={c.pos(p.element_type)}>{POS[p.element_type]}</span>
                <span style={c.lineupName}>{p.web_name}</span>
                <span className="num" style={c.lineupXp(xi.xpOf.get(p.id))}>{xi.xpOf.get(p.id).toFixed(1)}</span>
              </div>
            ))}
          </div>
        </>}
      </div>

      <hr style={c.weekRule}/>

      <div style={c.weekBlock}>
        <div style={c.weekKicker}>Transfer</div>
        {worthIt ? <>
          <div style={c.weekLead}>Byt {best.out} mot {best.inn}</div>
          <div style={c.weekSub}>
            Vinst {best.gain>=0?"+":""}{best.gain.toFixed(1)} xP över {best.horizon}.
            {best.cost>0
              ? <> Du har inga fria transfers kvar, så det kostar −4 — netto {best.net.toFixed(1)}.</>
              : <> Ryms i din {freeTransfers===1?"fria transfer":"fria transfers"}.</>}
          </div>
        </> : <>
          <div style={c.weekLead}>Gör ingen transfer</div>
          <div style={c.weekSub}>
            {best
              ? <>Bästa alternativet ger {best.gain>=0?"+":""}{best.gain.toFixed(1)} xP{best.cost>0?<> och kostar −4</>:null}. Spara {freeTransfers===1?"den":"dem"} — en bankad transfer är värd mer nästa vecka när du vet mer.</>
              : <>Inga byten inom budget som förbättrar laget.</>}
          </div>
        </>}
        <div style={{marginTop:"10px"}}>
          <button style={c.weekLink} onClick={()=>setTab("transfers")}>Se alla alternativ</button>
        </div>
      </div>

      <hr style={c.weekRule}/>

      <div style={c.weekBlock}>
        <div style={c.weekKicker}>Att hålla koll på</div>
        {hurt.map(p=>(
          <div key={p.id} style={c.weekFlag()}>
            <span style={c.weekDot(T.bad)}/>
            <span><strong>{p.web_name}</strong> spelar inte. {p.news||"Utanför truppen."} Han ger noll poäng om han står kvar i startelvan.</span>
          </div>
        ))}
        {doubt.map(p=>(
          <div key={p.id} style={c.weekFlag()}>
            <span style={c.weekDot(T.warn)}/>
            <span><strong>{p.web_name}</strong> är osäker — {(xMins(p)*100).toFixed(0)}% speltid. {p.news||""}</span>
          </div>
        ))}
        {hurt.length===0&&doubt.length===0 && (
          <div style={c.weekFlag()}>
            <span style={c.weekDot(T.good)}/>
            <span>Inga skador eller tveksamheter i din startelva.</span>
          </div>
        )}
        {/* Bänken avgör om auto-bytena räddar dig när en startspelare uteblir,
            så den ska stå här varje vecka — inte bara när elvan redan brinner. */}
        <div style={c.weekFlag()}>
          <span style={c.weekDot(T.line)}/>
          <span style={c.weekMuted}>{overlap} av dina 11 finns i template-elvan — den elva flest managers äger.
            {overlap>=8
              ? <> Du rör dig i stort sett med fältet: låg risk att rasa, men också få tillfällen att klättra.</>
              : overlap>=5
              ? <> Ungefär hälften template, hälften eget. Balanserat.</>
              : <> Ditt lag skiljer sig rejält från mängden. Det svänger mer, åt båda hållen.</>}</span>
        </div>
        <div style={c.weekFlag()}>
          <span style={c.weekDot(chipsLeft>0?T.line:T.warn)}/>
          <span style={c.weekMuted}>{chipsLeft>0
            ? <>Du har {chipsLeft} av 4 chips kvar den här säsongshalvan.</>
            : <>Du har inga chips kvar den här säsongshalvan.</>}</span>
        </div>
        <div style={c.weekFlag()}>
          <span style={c.weekDot(benchOk>=2?T.good:benchOk===1?T.warn:T.bad)}/>
          <span>{benchOk===0
            ? <>Din bänk är tom på spelbara alternativ ({benchDead} av {bench.length} spelar inte). Uteblir en startspelare får du noll för platsen — auto-bytet har ingen att hämta.</>
            : <>Bänken har {benchOk} spelbar{benchOk===1?"":"a"} av {bench.length}. {benchDead>0 && <>{benchDead} spelar inte{benchOk<2?" — tunn täckning om någon i elvan uteblir":""}.</>}</>}</span>
        </div>
      </div>
    </div>
  );
}

function ChartsTab({starters,bench,fm,tb,bs,history}){
  const squad=[...starters,...bench];
  const byXp=[...starters].sort((a,b)=>estimateXp(b,fm).xp-estimateXp(a,fm).xp);
  // Truppvärde per position — donut i systemets accenter.
  const posSum={2:0,3:0,4:0,1:0};
  for(const p of squad) posSum[p.element_type]+=p.now_cost/10;
  const tot=Object.values(posSum).reduce((a,b)=>a+b,0);
  const slices=[
    {k:"Anfall + mittfält", v:posSum[3]+posSum[4], col:T.brand},
    {k:"Försvar", v:posSum[2], col:T.info},
    {k:"Målvakt", v:posSum[1], col:T.alt},
  ];
  let acc=0;
  const arcs=slices.map(x=>{const from=acc/tot*100; acc+=x.v; return {...x,from,to:acc/tot*100};});
  return(
    <div>
      <div style={c.chartGrid}>
        <div>
          <div style={c.secTitle}>Var poängen kommer ifrån</div>
          <div style={c.chartLegend}>
            {[["Närvaro",T.mut],["Anfall",T.brand],["Clean sheet",T.info],["Bonus",T.alt]].map(([k,col])=>(
              <span key={k} style={c.legendTxt}><i style={c.legendDot(col)}/>{k}</span>
            ))}
          </div>
          {byXp.map(p=><XpBreakdown key={p.id} p={p} fm={fm}/>)}
        </div>
        <div>
          <div style={c.secTitle}>xP per kommande omgång</div>
          <div style={{...c.legendTxt,marginBottom:`${SP[4]}px`}}>
            Röd punkt = blank omgång. Odds gäller bara GW{SEASON.nextGw}; längre fram är det xG-modellen.
          </div>
          {byXp.slice(0,8).map(p=><XpSparkline key={p.id} p={p} fm={fm}/>)}
        </div>
      </div>

      <div style={{marginTop:`${SP[10]}px`}}>
        <div style={c.secTitle}>Poäng per omgång mot ligasnittet</div>
        <PointsPerGw history={history} bs={bs}/>
      </div>

      <div style={{marginTop:`${SP[10]}px`}}>
        <div style={c.secTitle}>Hotanalys · din vassaste startspelare</div>
        <ThreatBreakdown p={byXp[0]} squad={squad}/>
      </div>

      <div style={{marginTop:`${SP[10]}px`}}>
        <div style={c.secTitle}>Truppvärde fördelat</div>
        <div style={{display:"flex",gap:`${SP[6]}px`,alignItems:"center",flexWrap:"wrap"}}>
          <div style={{width:"150px",height:"150px",borderRadius:"50%",flexShrink:0,
            background:`conic-gradient(${arcs.map(a=>`${a.col} ${a.from}% ${a.to}%`).join(",")})`,
            WebkitMask:"radial-gradient(circle, transparent 56%, #000 57%)",
            mask:"radial-gradient(circle, transparent 56%, #000 57%)"}}/>
          <div>
            {arcs.map(a=>(
              <div key={a.k} style={{...c.chartRow,gap:`${SP[6]}px`,minWidth:"220px"}}>
                <span style={c.legendTxt}><i style={c.legendDot(a.col)}/>{a.k}</span>
                <span className="num" style={c.chartVal(T.ink)}>£{a.v.toFixed(1)}m · {(a.v/tot*100).toFixed(0)}%</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

            <div style={{fontSize:top?"22px":"15px",fontWeight:"500",color:top?T.warn:T.mut,width:"28px",textAlign:"center"}}>{top?"©":i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:"500",fontSize:"14px",color:T.ink}}>{p.web_name}</div>

              <div style={{fontSize:"13px",color:xpColor(p._xp),fontWeight:"600"}}>{p._xp.toFixed(1)} xP</div>

function FixtureTicker({starters,fm,tb}){
  const gws=[...new Set(starters.flatMap(p=>(fm[p.team]||[]).slice(0,5).map(f=>f.gw)))].sort((a,b)=>a-b).slice(0,5);
  const sorted=[...starters].sort((a,b)=>avgFdr(a.team,fm,5)-avgFdr(b.team,fm,5));
  return(
    <div>
      <div style={c.secTitle}>Sorterat på FDR-snitt (bäst överst)</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
          <thead><tr>
            <th style={{textAlign:"left",paddingBottom:"8px",color:T.mut,fontWeight:"500",paddingRight:"8px",minWidth:"80px"}}>Spelare</th>
            {gws.map(g=><th key={g} style={{textAlign:"center",paddingBottom:"8px",color:T.mut,fontWeight:"500",minWidth:"60px"}}>GW{g}</th>)}
            <th style={{textAlign:"right",paddingBottom:"8px",color:T.mut,fontWeight:"500"}}>Snitt</th>
          </tr></thead>
          <tbody>
            {sorted.map(p=>{
              const avg=avgFdr(p.team,fm,5);
              return(
                <tr key={p.id} style={{borderTop:`1px solid ${T.line}`}}>
                  <td style={{padding:"5px 8px 5px 0"}}>
                    <div style={{fontWeight:"500",fontSize:"13px",color:T.ink}}>{p.web_name}</div>
                    <div style={{fontSize:"11px",color:T.mut}}>{tb[p.team]?.short_name}</div>
                  </td>
                  {gws.map(g=>{
                    const f=(fm[p.team]||[]).find(fx=>fx.gw===g);
                    if(!f)return<td key={g} style={{textAlign:"center"}}><span style={{color:T.line}}>–</span></td>;
                    return(<td key={g} style={{textAlign:"center",padding:"3px 2px"}}>
                      <div style={{background:fdrBg(f.diff),color:fdrTx(f.diff),borderRadius:"5px",padding:"2px 5px",fontSize:"11px",fontWeight:"500",display:"inline-block",whiteSpace:"nowrap"}}>{tb[f.oppId]?.short_name}{f.home?"":" B"}</div>
                    </td>);
                  })}
                  <td style={{textAlign:"right",paddingLeft:"8px"}}><span style={{fontSize:"12px",fontWeight:"500",color:avg<=2.5?T.good:avg<=3.5?T.warn:T.bad}}>{avg.toFixed(1)}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function InjuryTab({starters,bench}){
  const all=[...starters,...bench];
  const injured=all.filter(p=>isInjured(p));
  const doubtful=all.filter(p=>!isInjured(p)&&isDoubtful(p));
  const Row=({p,type})=>(
    <div style={{padding:"8px 10px",background:type==="inj"?"#FAEFEC":T.warnBg,border:`.5px solid ${type==="inj"?T.bad:T.warn}`,borderRadius:"8px",marginBottom:"4px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
        <span style={c.pos(p.element_type)}>{POS[p.element_type]}</span>
        <span style={{flex:1,fontSize:"13px",color:T.ink,fontWeight:"500"}}>{p.web_name}</span>
        <span style={{fontSize:"11px",color:type==="inj"?T.bad:T.warn}}>{type==="inj"?"Ej tillgänglig":`Osäker (${p.chance_of_playing_next_round}%)`}</span>
      </div>
      {p.news&&<div style={{fontSize:"11px",color:T.mut,marginTop:"4px",paddingLeft:"24px"}}>{p.news}</div>}
    </div>
  );
  return(
    <div>
      {injured.length===0&&doubtful.length===0&&<div style={{fontSize:"13px",color:T.good,padding:"12px 0"}}>✓ Inga skador eller osäkra spelare!</div>}
      {injured.length>0&&<><div style={c.secTitle}>Skadade</div>{injured.map(p=><Row key={p.id} p={p} type="inj"/>)}</>}
      {doubtful.length>0&&<><div style={{...c.secTitle,marginTop:"12px"}}>Osäkra</div>{doubtful.map(p=><Row key={p.id} p={p} type="doubt"/>)}</>}
    </div>
  );
}

const TABS=[
  {id:"week",label:"Veckan",icon:"//"},
  {id:"captain",label:"Kapten",icon:"C"},
  {id:"transfers",label:"Byten",icon:"⇄"},
  {id:"fixtures",label:"Fixtures",icon:"▦"},
  {id:"chips",label:"Chips",icon:"◆"},
  {id:"charts",label:"Analys",icon:"◱"},
  {id:"injuries",label:"Skador",icon:"!"},
];

function App(){
  const [fplData,setFplData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [analyzing,setAnalyzing]=useState(false);
  const [results,setResults]=useState(null);
  const [tab,setTab]=useState("week");
  const [oddsStatus,setOddsStatus]=useState("off");

  // Sidan ligger i en iframe med fast hojd pa wennerqvist.design. I stallet
  // for att gissa ett tal rapporterar boten sin egen hojd till foraldern.
  // Klickas bokmärket när boten redan är öppen byter bara fragmentet, och
  // webbläsaren laddar inte om. Då måste vi göra det själva.
  useEffect(()=>{
    const onHash=()=>{ if(/[#&]team=/.test(location.hash)) location.reload(); };
    window.addEventListener("hashchange",onHash);
    return ()=>window.removeEventListener("hashchange",onHash);
  },[]);

  useEffect(()=>{
    if(window.parent===window) return;
    const post=()=>window.parent.postMessage(
      {type:"gafferos:height", height:document.documentElement.scrollHeight}, "*");
    post();
    const ro=new ResizeObserver(post);
    ro.observe(document.documentElement);
    return ()=>ro.disconnect();
  });

  useEffect(()=>{
    (async()=>{
      try{
        const [bs,entry]=await Promise.all([fplFetch("/bootstrap-static/"),fplFetch(`/entry/${TEAM_ID}/`)]);
        // Truppen finns bara för en spelad omgång; all planering sker mot nästa.
        // Två skilda begrepp, aldrig samma variabel.
        SEASON.gamesPlayed = bs.events.filter(e=>e.finished).length;
        SEASON.xgc = buildTeamXgc(bs);
        SEASON.xgiPrior = buildXgiPrior(bs);
        const squadGw=entry.current_event;
        if(!squadGw)throw new Error("Laget har ingen spelad omgång ännu (entry.current_event saknas) — inget att planera utifrån.");
        const next=bs.events.find(e=>e.is_next);
        if(!next)throw new Error("FPL har ingen kommande omgång (is_next saknas) — går inte att ge råd för nästa GW.");
        const gw=next.id;
        SEASON.nextGw=gw;
        const [picks,rawFx,history]=await Promise.all([fplFetch(`/entry/${TEAM_ID}/event/${squadGw}/picks/`),fplFetch("/fixtures/"),fplFetch(`/entry/${TEAM_ID}/history/`)]);
        let freeTransfers=freeTransfersFor(history,gw);
        const chipAvail=chipAvailability(bs,history,gw);
        const fm={};
        for(const f of rawFx){
          if(!f.event||f.event<gw)continue;
          const push=(tid,oppId,diff,home)=>{if(!fm[tid])fm[tid]=[];fm[tid].push({gw:f.event,oppId,diff,home});};
          push(f.team_h,f.team_a,f.team_h_difficulty,true);
          push(f.team_a,f.team_h,f.team_a_difficulty,false);
        }
        for(const k of Object.keys(fm))fm[k].sort((a,b)=>a.gw-b.gw);
        const pb=Object.fromEntries(bs.elements.map(p=>[p.id,p]));
        const tb=Object.fromEntries(bs.teams.map(t=>[t.id,t]));
        // Live-truppen vinner nar den finns och galler ratt omgang. Da speglar
        // boten det lag som faktiskt stallts upp, inte det som senast spelade.
        const live = captureLiveSquadFromHash() || readLiveSquad(gw);
        const liveOk = live && !live.error;
        const source = liveOk ? {picks:live.picks, gw} : {picks:picks.picks, gw:squadGw};

        const bank = liveOk && typeof live.bank==="number"
          ? live.bank/10
          : picks.entry_history.bank/10;
        // FPL:s egna siffror slår vår härledning när vi har dem. Måste stå
        // EFTER att live är deklarerad — Babel gör const till var, så en
        // åtkomst här ovanför blir tyst undefined i stället för att kasta.
        //
        // /my-team/ ger transfers som {limit, made, cost, status, bank, value}.
        // limit är TILLDELNINGEN för omgången, inte återstoden — med limit 1
        // och made 1 är noll kvar, och status "cost" bekräftar att nästa byte
        // kostar poäng. Att läsa limit rakt av gav fel siffra i UI:t.
        const tr = liveOk ? live.raw : null;
        if(tr && typeof tr.limit==="number" && typeof tr.made==="number")
          freeTransfers = Math.max(0, tr.limit - tr.made);
        const myP=source.picks.map(p=>({...pb[p.element],sqPos:p.position,isCaptain:p.is_captain,isVice:p.is_vice_captain}));
        const starters=myP.filter(p=>p.sqPos<=11);
        const bench=myP.filter(p=>p.sqPos>11).sort((a,b)=>a.sqPos-b.sqPos);

        // Odds-plugin: försök bara om aktiverad. Ingen tyst fallback.
        let haveOdds=false;
        if(ODDS.enabled){
          try{ await ODDS.fetchOdds(); setOddsStatus("on"); haveOdds=true; }
          catch(e){ setOddsStatus("error"); }
        }
        // Skalan mellan odds- och xG-vägen mäts när båda finns. Utan odds
        // finns inget att kalibrera mot och proxyn får stå som den är.
        SEASON.attackScale = haveOdds ? calibrateAttackScale(bs.elements,fm) : 1;

        // Truppvärde: FPL ger det i tiondelar, och bara via /my-team/.
        const squadValue = tr && typeof tr.value==="number" ? tr.value/10 : null;
        setFplData({bs,entry,fm,tb,gw,squadGw:source.gw,bank,starters,bench,freeTransfers,chipAvail,squadValue,history,live:liveOk?live:null,liveError:live&&live.error?live.error:null});
      }catch(e){setError(e.message);}
      finally{setLoading(false);}
    })();
  },[]);

  function runTransfers(){
    setAnalyzing(true);
    setTimeout(()=>{
      const{bs,fm,tb,gw,bank,starters,bench,freeTransfers}=fplData;
      setResults(buildRecs(starters,bench,bs,fm,tb,bank,gw,freeTransfers));
      setAnalyzing(false);
    },400);
  }

  if(loading)return<div style={{padding:"3rem",textAlign:"center",color:T.mut,fontFamily:"system-ui"}}><div style={{fontSize:"32px",marginBottom:"12px"}}>⚽</div><div>Hämtar ditt lag...</div></div>;
  if(error)return<div style={c.error}>Kunde inte hämta FPL-data: {error}</div>;
  const{entry,gw,squadGw,bank,starters,bench,fm,tb,bs,freeTransfers,chipAvail,squadValue,history,live,liveError}=fplData;

  // Lagen som spelar den omgång vi planerar för, och vilka av dem som saknar
  // odds. Utan detta påstår badgen "odds-modell aktiv" även när halva
  // omgången i själva verket körs på xG-proxyn.
  const teamsThisGw = Object.keys(fm).map(Number).filter(tid=>fm[tid][0]?.gw===gw);
  const teamsNoOdds = teamsThisGw.filter(tid=>!ODDS.byTeam[tid]);
  const fullCover = oddsStatus==="on" && teamsNoOdds.length===0;
  const oddsLabel = oddsStatus==="on"
    ? `Odds-modell aktiv · ${teamsThisGw.length-teamsNoOdds.length}/${teamsThisGw.length} lag`
    : oddsStatus==="error"?"Odds ej tillgängligt — kör på xG-data":"xG-modell (odds ej påkopplat)";

  return(
    <div style={c.root}>
     <div className="shell">
      <nav className="rail">
        <div style={c.railBrand}>GAFFER/OS</div>
        {TABS.map(t=>(
          <button key={t.id} style={c.railBtn(tab===t.id)} onClick={()=>setTab(t.id)}>
            <span style={c.railIcon}>{t.icon}</span>
            <span className="lbl">{t.label}</span>
          </button>
        ))}
        <div className="railfoot">
          <div style={c.oddsBadge(fullCover)}>{fullCover?"●":"○"} {oddsLabel}</div>
          {oddsStatus==="on" && teamsNoOdds.length>0 &&
            <div style={c.oddsWarn}>Utan odds, körs på xG: {teamsNoOdds.map(t=>tb[t]?.short_name).join(", ")}</div>}
          {ODDS.coverage?.unmappedTeams?.length>0 &&
            <div style={c.oddsWarn}>Omappade lagnamn: {ODDS.coverage.unmappedTeams.join(", ")}</div>}
        </div>
      </nav>
      <main>
      <div style={c.hdr}>
        <div style={c.hdrTitle}>{entry.name}</div>
        <div style={c.hdrSub}>FPL Advisor · GW{gw}</div>
        <div style={c.stats}>
          <div style={c.stat}><div style={c.statVal}>#{entry.summary_overall_rank?.toLocaleString("sv-SE")}</div><div style={c.statLbl}>Rank</div></div>
          <div style={c.stat}><div style={c.statVal}>£{bank.toFixed(1)}m</div><div style={c.statLbl}>I banken</div></div>
          <div style={c.stat}><div style={c.statVal}>GW{gw}</div><div style={c.statLbl}>Nästa omgång</div></div>
          <div style={c.stat}><div style={c.statVal}>{freeTransfers}</div><div style={c.statLbl}>{freeTransfers===1?"Fri transfer":"Fria transfers"}</div></div>
          {squadValue!=null &&
            <div style={c.stat}><div style={c.statVal}>£{squadValue.toFixed(1)}m</div><div style={c.statLbl}>Truppvärde</div></div>}
        </div>
      </div>

      <div style={c.squad}>
        <div style={c.sLbl}>
          Startspelare · {live ? <>ditt lag för GW{gw}</> : <>ditt lag i GW{squadGw}</>}
        </div>
        {live
          ? <div style={c.liveNote}>
              ● Trupp och bank hämtade från FPL {new Date(live.savedAt).toLocaleString("sv-SE",{dateStyle:"short",timeStyle:"short"})}.
              {!(live.raw && typeof live.raw.limit==="number" && typeof live.raw.made==="number") &&
                <> Antalet fria transfers kom INTE med — det visade talet är härlett och kan vara fel.
                   {live.raw ? <> FPL skickade fälten: {Object.keys(live.raw).join(", ")}.</> : null}</>}
              {" "}<button style={c.weekLink} onClick={()=>{try{localStorage.removeItem(LIVE_KEY);}catch{} location.reload();}}>Rensa</button>
            </div>
          : <div style={c.staleNote}>
              FPL publicerar en omgångs trupp först när dess deadline passerat. Har du
              gjort byten inför GW{gw} syns de inte här, och då kan både truppen ovan,
              antalet fria transfers och bytesförslagen gälla ett lag du redan ändrat.
              Använd bokmärkesknappen för att hämta ditt aktuella lag.
            </div>}
        {liveError && <div style={c.errNote}>Bokmärkesknappen skickade något boten inte förstod: {liveError}</div>}
        <Pitch players={starters} fm={fm} tb={tb} bench={false}/>
        <div style={c.bLbl}>Bänk · i ordning för auto-byten</div>
        <Pitch players={bench} fm={fm} tb={tb} bench={true} singleRow/>
      </div>


      {tab==="week"&&<WeekTab starters={starters} bench={bench} bs={bs} fm={fm} tb={tb} bank={bank} gw={gw} freeTransfers={freeTransfers} chipAvail={chipAvail} setTab={setTab}/>}
      {tab==="transfers"&&(
        <div>
          <div style={c.ftBox}>
            Du har <strong>{freeTransfers}</strong> {freeTransfers===1?"fri transfer":"fria transfers"} den här omgången.
            Varje ytterligare byte kostar <strong>−4 poäng</strong>.
            {live?.raw?.status==="cost" && <> FPL säger att din nuvarande plan redan kostar <strong>−{live.raw.cost}</strong>.</>}
            {" "}Förslagen nedan är <em>alternativ</em> — de är inte tre byten att göra.
          </div>
          <button style={c.btn(analyzing)} onClick={runTransfers} disabled={analyzing}>{analyzing?"Analyserar...":"✦ Visa mina alternativ"}</button>
          {results&&<div style={{marginTop:"16px"}}>
            {results.every(r=>r.verdict==="nej") &&
              <div style={{...c.ftBox,borderColor:T.good,color:T.good}}>
                <strong>Rekommendation: gör ingenting.</strong> Inget av alternativen nedan går plus.
                Att spara transfern är ett fullgott drag — de flesta omgångar är det rätt svar.
              </div>}
            {results.map((rec,i)=><TransferCard key={i} rec={rec}/>)}
          </div>}
          {!results&&<div style={{fontSize:"13px",color:T.mut,textAlign:"center",padding:"24px 0"}}>Tryck på knappen för transferrekommendationer.</div>}
        </div>
      )}
      {tab==="chips"&&<ChipTab starters={starters} bench={bench} fm={fm} tb={tb} gw={gw} bs={bs} chipAvail={chipAvail}/>}
      {tab==="fixtures"&&<FixtureTicker starters={starters} fm={fm} tb={tb}/>}
      {tab==="captain"&&<CaptainTab starters={starters} fm={fm} tb={tb}/>}
      {tab==="charts"&&<ChartsTab starters={starters} bench={bench} fm={fm} tb={tb} bs={bs} history={history}/>}
      {tab==="injuries"&&<InjuryTab starters={starters} bench={bench}/>}

      </main>
     </div>
      <div style={c.disclaimer}>xP-modell byggd på speltidsandel (xMins), xG/xA per 90, clean sheet-sannolikhet och fixtures. Odds kopplas på via plugin. Alltid ditt eget ansvar att fatta det slutliga beslutet.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("fpl-root")).render(<App/>);
</script>
